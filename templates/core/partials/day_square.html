<div id="square-{{ habit.id }}-{{ day.date_str }}"
    class="w-3 h-3 rounded-sm cursor-pointer transition-all hover:ring-1 hover:ring-white/50 relative day-square"
    style="background-color: {% if day.is_checked %}{{ color }}{% else %}#171717{% endif %}"
    hx-post="{% url 'toggle_checkin' %}" hx-vals='{"habit_id": "{{ habit.id }}", "date": "{{ day.date_str }}"}'
    hx-swap="outerHTML" title="{{ day.date|date:'M d, Y' }}">
    <!-- Tooltip (Simple CSS based) -->
    <!-- Could use a more robust tooltip lib but CSS is lightweight -->
</div>
