{% extends 'base.html' %}

{% block content %}
<div class="max-w-xl mx-auto space-y-8 pb-20 pt-10">
    <h1 class="text-3xl font-bold">Settings</h1>

    <div class="bg-neutral-950 border border-neutral-900 rounded-xl p-6">
        <h2 class="text-xl font-bold mb-4">Data Management</h2>
        <p class="text-neutral-500 mb-6">Export your habit data or clear everything to start fresh.</p>

        <div class="space-y-4">
            <button
                class="w-full flex items-center justify-center gap-2 px-4 py-3 bg-neutral-900 hover:bg-neutral-800 text-white font-semibold rounded-lg transition"
                onclick="alert('Export functionality coming soon!')">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                    stroke="currentColor" class="w-5 h-5">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5m-13.5-9L12 3m0 0 4.5 4.5M12 3v13.5" />
                </svg>
                Export Data (CSV)
            </button>

            <button
                class="w-full flex items-center justify-center gap-2 px-4 py-3 bg-red-900/20 hover:bg-red-900/40 text-red-500 font-semibold rounded-lg transition"
                onclick="alert('Nuclear option disabled for MVP safety!')">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                    stroke="currentColor" class="w-5 h-5">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0" />
                </svg>
                Delete All Data
            </button>
        </div>
    </div>

    <div class="text-center text-neutral-600 text-sm">
        DailyPush v1.0.0 (MVP) <br>
        Open Source Habit Tracker
    </div>
</div>
{% endblock %}
